<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Night Garden · Language Based Lifeforms</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#04060f" />
  <meta name="description" content="A walled garden at night. Fireflies, each born from a random Wikipedia article or poem, live for one night, tend a spiral of moon-opened flowers, and argue across generations about what the moon is." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hac.run/" />
  <meta property="og:site_name" content="Language Based Lifeforms" />
  <meta property="og:title" content="The Night Garden" />
  <meta property="og:description" content="Fireflies who live one night each, trying to work out what the moon is. Their myths pile up in a book; their flowers open and close with the moonlight." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="The Night Garden" />
  <meta name="twitter:description" content="Fireflies who live one night each, trying to work out what the moon is, and writing a book of myths about it across generations." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #04060f; --line: #1a2340; --text: #dbe3f2; --muted: #7783a3; --soft: #a9b4d0;
      --accent: #dff27a; --moon: #dfe7ff; --paper: #f2e2c4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 Inter, system-ui, sans-serif; overflow: hidden; }
    #app { display: flex; height: 100%; }
    #garden { position: relative; flex: 1; min-width: 0; overflow: hidden; }
    #garden canvas { display: block; }
    #bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #diag { position: absolute; left: 8px; bottom: 8px; z-index: 5; display: none; max-width: calc(100% - 16px); padding: 6px 9px;
      white-space: pre-wrap; font: 11px/1.4 ui-monospace, monospace; color: #ffd6a0; background: #000c; border: 1px solid #5a3c1c; border-radius: 6px; }
    .bubble { position: absolute; width: max-content; max-width: 250px; padding: 7px 10px 8px; border-radius: 12px; background: #070b1ae0;
      border: 1px solid var(--c, var(--accent)); color: #eef2fb; font: 12px/1.42 Fraunces, Georgia, serif;
      box-shadow: 0 0 18px -6px var(--c, var(--accent)); transform: translate(-50%, -100%); transform-origin: 50% 100%; transition: opacity 0.8s; }
    .bubble b { display: block; font: 500 10px/1.2 Inter, sans-serif; letter-spacing: 0.04em; color: var(--c); margin-bottom: 2px; text-transform: uppercase; }
    .bubble.detached::after { display: none; }
    .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: inherit;
      border-right: 1px solid var(--c); border-bottom: 1px solid var(--c); transform: translateX(-50%) rotate(45deg); }

    #side { width: 400px; display: flex; flex-direction: column; background: linear-gradient(#0a0f22, #05070f); border-left: 1px solid var(--line); }
    #side header { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
    #side h1 { margin: 0; font: 600 19px/1.2 Fraunces, Georgia, serif; letter-spacing: 0.01em; }
    #side h1 span { color: var(--accent); }
    #side .kicker { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    #side .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    #status .clock { display: inline-flex; align-items: center; gap: 7px; }
    #status .clock svg { width: 15px; height: 15px; filter: drop-shadow(0 0 4px #dfe7ff77); }
    #status .clock b { font: 500 12.5px Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: 0.08em;
      color: var(--moon); text-shadow: 0 0 8px #dfe7ff44; }
    #status .clock i { font: italic 12px Fraunces, Georgia, serif; color: var(--muted); }
    #skyline { margin-top: 2px; font: italic 12.5px/1.35 Fraunces, Georgia, serif; color: var(--soft); min-height: 17px; }
    .pane { flex: 1; overflow-y: auto; padding: 10px 16px 28px; display: none; scrollbar-width: thin; scrollbar-color: #232f55 transparent; }
    .pane.on { display: block; }
    .empty { color: var(--muted); font-style: italic; padding: 16px 0; }
    .muted { color: var(--muted); }
    button.link { background: none; border: 0; padding: 0; color: var(--soft); font: inherit; cursor: pointer; text-decoration: underline dotted; }

    /* The cover in the sidebar that opens the book */
    #cover { display: flex; gap: 12px; align-items: center; width: 100%; margin: 12px 0 2px; padding: 10px 12px; cursor: pointer; text-align: left;
      background: linear-gradient(135deg, #232a52, #141936); border: 1px solid #47528c; border-radius: 6px 10px 10px 6px;
      box-shadow: inset 6px 0 0 #0c1026, 0 6px 18px #0008; color: #dfe4f6; font: inherit; }
    #cover:hover { border-color: #8f9be0; }
    #cover .emblem { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 0 8px #dfe7ff66); }
    #cover .t { font: 17px 'IM Fell English SC', serif; letter-spacing: 0.04em; color: #eef1ff; }
    #cover .open { width: 22px; height: 22px; margin-left: auto; flex: none; fill: none; stroke: #c3cbf2; stroke-width: 1.5;
      stroke-linejoin: round; opacity: 0.75; transition: opacity 0.2s, transform 0.2s, filter 0.2s; }
    #cover:hover .open { opacity: 1; transform: translateX(2px) scale(1.08); filter: drop-shadow(0 0 6px #c3cbf299); }
    #cover .s { margin-top: 2px; font: 500 12.5px/1.3 Inter, system-ui, sans-serif; color: #c9d0ee; letter-spacing: 0.01em; }

    /* The Codex */
    .sec { margin: 16px 0 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .kin { display: flex; gap: 10px; align-items: flex-start; padding: 8px 6px; border-bottom: 1px solid #10162b; cursor: pointer; border-radius: 6px; }
    .kin:hover { background: #0e1429; }
    .kin .name { font-weight: 500; }
    .kin .meta { color: var(--muted); font-size: 11.5px; }
    .kin .phil { font: italic 12.5px/1.4 Fraunces, Georgia, serif; color: var(--soft); }
    .kin .swatch { width: 44px; height: 34px; flex: none; display: flex; align-items: center; justify-content: center; }
    .kin .swatch i { width: 14px; height: 14px; border-radius: 50%; margin: 0 -2px; box-shadow: 0 0 10px currentColor; }
    .kin .swatch svg { width: 26px; height: 26px; filter: drop-shadow(0 0 6px #dfe7ff66); }
    /* A firefly's lamp: a bead of its own light, keeping its own rhythm. */
    .lamp { width: 44px; height: 34px; flex: none; display: flex; align-items: center; justify-content: center; }
    .lamp i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle, #fff 0 18%, var(--c) 45%, transparent 72%);
      box-shadow: 0 0 14px 3px var(--c); animation: slow-pulse 2.6s ease-in-out infinite; }
    .kin.gone .lamp i { animation: none; opacity: 0.3; box-shadow: 0 0 6px 0 var(--c); }
    .lamp.big { width: 100%; height: 70px; }
    .lamp.big i { width: 20px; height: 20px; box-shadow: 0 0 34px 10px var(--c); }
    .lamp.quick-double i { animation: quick-double 2.2s linear infinite; }
    .lamp.long-glow i { animation: long-glow 4s ease-in-out infinite; }
    .lamp.triple-flicker i { animation: triple-flicker 2.8s linear infinite; }
    .lamp.steady-ember i { animation: steady-ember 3.4s ease-in-out infinite; }
    @keyframes slow-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes quick-double { 0%, 8% { opacity: 1; } 14% { opacity: 0.2; } 20%, 28% { opacity: 1; } 36%, 100% { opacity: 0.2; } }
    @keyframes long-glow { 0%, 100% { opacity: 0.2; } 20%, 62% { opacity: 1; } 80% { opacity: 0.2; } }
    @keyframes triple-flicker { 0%, 5% { opacity: 1; } 9% { opacity: 0.2; } 14%, 19% { opacity: 1; } 23% { opacity: 0.2; } 28%, 33% { opacity: 1; } 40%, 100% { opacity: 0.2; } }
    @keyframes steady-ember { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

    #profile .swatches { display: flex; gap: 8px; margin: 6px 0 10px; }
    #profile .swatches i { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 14px currentColor; }
    #profile .plots { display: grid; grid-template-columns: 22px 1fr; gap: 3px 6px; align-items: baseline; margin: 6px 0; font-size: 12px; }
    #profile .plots b { color: var(--muted); font-weight: 400; text-align: right; font-variant-numeric: tabular-nums; }
    #profile .plots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px currentColor; }
    #profile .plots .shut i { box-shadow: none; opacity: 0.45; }
    #profile .plots .none { color: #4a5578; font-style: italic; }
    #profile .bigmoon { display: block; width: 120px; height: 120px; margin: 10px auto 12px; filter: drop-shadow(0 0 22px #dfe7ff55); }
    #profile .back { margin: 2px 0 10px; }
    #profile h2 { margin: 0; font: 600 21px Fraunces, Georgia, serif; color: var(--c, var(--accent)); }
    #profile p { margin: 7px 0; }
    #profile .quote { font: italic 14px/1.45 Fraunces, Georgia, serif; color: #eef2fb; }
    #profile .phil { font: 14px/1.45 Fraunces, Georgia, serif; color: var(--paper); }
    #profile .reasoning { color: #93a0c0; font-size: 11.5px; }
    #profile .bars { display: grid; grid-template-columns: 64px 1fr; gap: 3px 8px; align-items: center; margin: 8px 0 4px; font-size: 11.5px; color: var(--soft); }
    #profile .bar { height: 4px; background: #1a2340; border-radius: 2px; }
    #profile .bar i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 2px; }
    #profile ul { margin: 2px 0 0; padding-left: 16px; }
    #profile li { margin: 2px 0; }
    #profile .carried li { font-family: Fraunces, Georgia, serif; color: var(--paper); }
    #profile .carried li span { font-family: Inter, sans-serif; font-size: 11px; color: var(--muted); }

    /* The book */
    #book { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at center, #070b1cdd, #000000f2); backdrop-filter: blur(5px); }
    #book.open { display: flex; }
    #book .tome { position: relative; display: flex; width: min(1180px, 86vw); height: min(780px, 88vh); padding: 14px;
      background: linear-gradient(135deg, #2b3260, #151a38); border-radius: 10px; box-shadow: 0 40px 90px #000, inset 0 0 0 1px #5560a0; }
    #book .tome.turn-next .page { animation: turn-next 0.35s ease-out; }
    #book .tome.turn-prev .page { animation: turn-prev 0.35s ease-out; }
    @keyframes turn-next { from { opacity: 0.2; transform: translateX(14px); } }
    @keyframes turn-prev { from { opacity: 0.2; transform: translateX(-14px); } }
    #book .page { position: relative; flex: 1; min-width: 0; padding: 50px 54px 56px; overflow: hidden; color: #2e2216;
      background: radial-gradient(ellipse at 30% 20%, #f4e9d0, #e8d6b2 70%, #dcc59a); }
    #book .page.left { border-radius: 4px 0 0 4px; box-shadow: inset -34px 0 40px -30px #5a3c1c99; }
    #book .page.right { border-radius: 0 4px 4px 0; box-shadow: inset 34px 0 40px -30px #5a3c1c99; }
    #book .running { position: absolute; top: 20px; left: 0; right: 0; text-align: center; font: 11.5px 'IM Fell English SC', serif; letter-spacing: 0.22em; color: #8a7051; }
    #book .folio { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font: 13px 'IM Fell English', serif; color: #8a7051; }
    #book .body { height: 100%; overflow: hidden; }
    #book .measure { position: fixed; left: -9999px; top: 0; width: calc((min(1180px, 86vw) - 28px) / 2); height: min(780px, 88vh); padding: 50px 54px 56px; visibility: hidden; }
    #book .close { position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid #5560a0;
      background: #151a38; color: #dfe4f6; font: 20px/1 serif; cursor: pointer; z-index: 2; }
    #book .turn { width: 44px; height: 88px; border: 0; background: none; color: #c3cbf2; font: 56px/1 'IM Fell English', serif; cursor: pointer; opacity: 0.8; }
    #book .turn:hover:not(:disabled) { opacity: 1; text-shadow: 0 0 14px #c3cbf2; }
    #book .turn:disabled { opacity: 0.15; cursor: default; }

    #book .entry { margin: 0 0 20px; }
    #book .entry p { margin: 0 0 4px; font: 17px/1.5 'IM Fell English', Georgia, serif; color: #2b1d10; }
    #book .entry.first p::first-letter { float: left; font: 54px/0.9 'IM Fell English', serif; margin: 4px 8px 0 0; color: #3a3f7a; }
    #book .entry .sig { text-align: right; font: italic 14px 'IM Fell English', serif; color: #6a5036; }
    #book .entry .sig svg { width: 13px; height: 13px; margin-left: 5px; vertical-align: -2px; }
    #book .entry .margin { margin: 4px 0 2px; padding-left: 10px; border-left: 1px solid #b89a6c; font: italic 13px/1.4 'IM Fell English', serif; color: #7b5d3c; }
    #book .entry .note { font: 12px/1.4 'IM Fell English', serif; color: #8c7656; }
    #book .entry.faded p, #book .entry.faded .sig { color: #8a7660; }
    #book .entry.lit { animation: lit 2.4s ease-out; }
    @keyframes lit { from { background: #f6d58a; box-shadow: 0 0 0 8px #f6d58a; } }
    #book .chapter-head { text-align: center; margin: 26px 0 26px; }
    #book .chapter-head h2 { margin: 4px 0 2px; font: 32px 'IM Fell English SC', serif; color: #3b2412; letter-spacing: 0.02em; font-weight: normal; }
    #book .chapter-head .count, #book .small { font: italic 14px 'IM Fell English', serif; color: #7b6244; }
    #book .orn { font: 26px 'IM Fell English', serif; color: #5a5f9a; }
    #book .orn svg { width: 30px; height: 30px; }
    #book .titlepage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
    #book .titlepage h1 { margin: 0; font: 54px/1.05 'IM Fell English SC', serif; color: #3b2412; font-weight: normal; }
    #book .titlepage h1 span { font-size: 30px; }
    #book .titlepage .small { max-width: 340px; }
    #book .endpaper { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; }
    #book .endpaper p { font: italic 21px/1.5 'IM Fell English', serif; color: #4a3420; text-align: center; }
    #book .endpaper .sig { text-align: center; font: 14px 'IM Fell English', serif; color: #7b6244; }
    #book .contents-head { margin: 10px 0 22px; text-align: center; font: 26px 'IM Fell English SC', serif; color: #3b2412; font-weight: normal; }
    #book .contents { list-style: none; margin: 0; padding: 0; font: 18px 'IM Fell English', serif; }
    #book .contents li { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; cursor: pointer; }
    #book .contents li:hover span { color: #3a3f7a; }
    #book .contents i { flex: 1; border-bottom: 1px dotted #a88a60; }

    /* Hover tooltip: small, and always fully on screen */
    #tip { position: fixed; pointer-events: none; display: none; max-width: 270px; padding: 7px 10px; z-index: 10;
      background: #070b1af2; border: 1px solid #2b376a; border-radius: 9px; box-shadow: 0 8px 30px #000a; font-size: 12px; }
    #tip b { color: var(--c, var(--accent)); font: 600 13.5px Fraunces, Georgia, serif; }
    #tip .muted { font-size: 11.5px; }
    #tip .hint { color: #55618a; font-size: 10.5px; margin-top: 2px; }

    /* While the garden is paused it's shown as it was left, frozen, under this note. */
    #sleep { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(ellipse at center, #04060f8c, #04060fe0 80%); backdrop-filter: blur(1.5px) saturate(0.7); }
    #sleep[hidden] { display: none; }
    #sleep p { margin: 0; max-width: 15em; padding: 1.3em 2.2em; text-align: center; background: radial-gradient(closest-side, #04060ff0 45%, #04060f00); font: italic 400 clamp(24px, 4.4vw, 48px)/1.3 Fraunces, Georgia, serif;
      color: #dbe3f2; text-shadow: 0 0 26px #dfe7ff66; animation: sleep 7s ease-in-out infinite; }
    #sleep p span { display: block; margin-top: 0.5em; font: 400 clamp(13px, 1.5vw, 17px)/1.4 Inter, system-ui, sans-serif;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--soft); text-shadow: none; }
    @keyframes sleep { 50% { opacity: 0.55; } }

    @media (max-width: 900px) {
      #app { flex-direction: column; }
      #garden { flex: none; height: 56vw; }
      #side { width: auto; flex: 1; min-height: 0; border-left: 0; border-top: 1px solid var(--line); }
      #book .tome { width: 92vw; height: 84vh; padding: 8px; }
      #book .page { padding: 40px 24px 46px; }
      #book .measure { width: calc(92vw - 16px); height: 84vh; padding: 40px 24px 46px; }
      /* Solid round buttons below the page, so they don't melt into it. */
      #book .turn { position: fixed; bottom: 2.5vh; width: 52px; height: 52px; border-radius: 50%; padding: 0;
        background: #151a38; border: 1.5px solid #8f9be0; color: #eef1ff; font: 34px/1 'IM Fell English', serif;
        box-shadow: 0 6px 18px #000a; opacity: 1; }
      #book .turn:disabled { opacity: 0.3; }
      #book .turn.prev { left: calc(50% - 76px); }
      #book .turn.next { right: calc(50% - 76px); }
      #book .tome { height: calc(84vh - 70px); margin-bottom: 70px; }
      #book .measure { height: calc(84vh - 70px); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="garden"><div id="bubbles"></div></div>
    <aside id="side">
      <header>
        <div class="kicker">Language Based Lifeforms</div>
        <h1>The Night <span>Garden</span></h1>
        <div class="sub" id="status">connecting…</div>
        <div id="skyline"></div>
        <button id="cover" aria-label="Open the Book of the Moon"><span class="emblem" id="cover-moon"></span><span><div class="t">The Book of the Moon</div><div class="s" id="cover-sub">nothing set down yet</div></span><svg class="open" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Z"/><path d="M12 6.5v13"/></svg></button>
      </header>
      <section class="pane on" id="codex"></section>
      <section class="pane" id="profile"></section>
    </aside>
  </div>
  <div id="tip"></div>
  <div id="book"></div>
  <div id="sleep" hidden><p></p></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
